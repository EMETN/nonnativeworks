# pnpm 11's default, pinned so a future default change can't silently weaken it.
minimumReleaseAge: 1440

# Force the vulnerable nested sharp (0.34.5, pulled in by Netlify's dev image
# tooling) up to the patched line. Astro already resolves 0.35.3 elsewhere.
overrides:
  sharp: '^0.35.0'

allowBuilds:
  '@sentry/cli': true
  core-js: true
  esbuild: true
  sharp: true
  simple-git-hooks: true
minimumReleaseAgeExclude:
  - '@posthog/browser-common@0.5.0'
  - '@sentry/astro@10.70.0'
  - '@sentry/browser-utils@10.70.0'
  - '@sentry/browser@10.70.0'
  - '@sentry/core@10.70.0'
  - '@sentry/feedback@10.70.0'
  - '@sentry/node-core@10.70.0'
  - '@sentry/node@10.70.0'
  - '@sentry/opentelemetry@10.70.0'
  - '@sentry/replay-canvas@10.70.0'
  - '@sentry/replay@10.70.0'
  - '@sentry/server-utils@10.70.0'
  - '@supabase/auth-js@2.112.3'
  - '@supabase/functions-js@2.112.3'
  - '@supabase/postgrest-js@2.112.3'
  - '@supabase/realtime-js@2.112.3'
  - '@supabase/storage-js@2.112.3'
  - '@supabase/supabase-js@2.112.3'
  - posthog-js@1.415.2
