[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_POSTHOG_HOST,PUBLIC_POSTHOG_KEY,PUBLIC_SENTRY_DSN,PUBLIC_SUPABASE_ANON_KEY,PUBLIC_SUPABASE_URL,SENTRY_ORG,SENTRY_PROJECT,SENTRY_DSN,SUPABASE_URL,SUPABASE_ANON_KEY,DOPPLER_PROJECT"

[[redirects]]
  from = "/t/*"
  to = "https://eu.i.posthog.com/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/countries"
  [headers.values]
    Cache-Control = "public, max-age=60, s-maxage=300, stale-while-revalidate=86400"

[[headers]]
  for = "/companies"
  [headers.values]
    Cache-Control = "public, max-age=60, s-maxage=300, stale-while-revalidate=86400"
