[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_POSTHOG_KEY,PUBLIC_SENTRY_DSN,SENTRY_ORG,SENTRY_PROJECT,SENTRY_DSN,SUPABASE_URL,SUPABASE_ANON_KEY,DOPPLER_PROJECT"

[[redirects]]
  from = "/t/*"
  to = "https://eu.i.posthog.com/:splat"
  status = 200
  force = true

# Set at the CDN layer, not middleware: prerendered pages never invoke middleware at request time.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
