name: Bug report
description: Something on the site or in the scraper is wrong
labels: ['bug']
body:
    - type: markdown
      attributes:
          value: |
              For security vulnerabilities, please use
              [private reporting](../security/advisories/new) instead of this form.

    - type: textarea
      id: what
      attributes:
          label: What happened
          description: Include the page URL or the company involved, if relevant.
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: What you expected instead
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. Go to /finland
              2. ...

    - type: dropdown
      id: area
      attributes:
          label: Area
          options:
              - Public site
              - Scraped data looks wrong
              - Scraper / company integration
              - Admin area
              - Not sure
