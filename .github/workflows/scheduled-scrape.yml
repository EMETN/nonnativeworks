name: Scheduled scrape

# Runs every 2 days at 06:00 UTC.
# Also available as a manual trigger (Actions tab → "Run workflow") for testing.
on:
    schedule:
        - cron: '0 4 * * 1-5' # Mon–Fri at 06:00 EET (UTC+2); runs at 07:00 during EEST (summer)
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Dry run (scrape but do not upload)'
                type: boolean
                default: false
    push:
        branches:
        - fix/workflow-scraper-issue

# Only one run at a time — if a previous run is still going, cancel it.
concurrency:
    group: scheduled-scrape
    cancel-in-progress: true

jobs:
    # # ── Step 1: read companies.yaml and split into parallel slices ──────────────
    # generate-matrix:
    #   runs-on: ubuntu-latest
    #   outputs:
    #     matrix: ${{ steps.matrix.outputs.matrix }}
    #   steps:
    #     - uses: actions/checkout@v4
    #
    #     - uses: actions/setup-python@v5
    #       with:
    #         python-version: '3.12'
    #
    #     - name: Install PyYAML
    #       run: pip install pyyaml
    #
    #     - name: Generate matrix
    #       id: matrix
    #       run: |
    #         python - <<'EOF'
    #         import yaml, json, os
    #
    #         with open("scraper/companies.yaml") as f:
    #             data = yaml.safe_load(f)
    #         companies = (data or {}).get("companies") or []
    #         # Cap at 3 parallel slices; use 1 when the list is empty (no-op run)
    #         n = min(3, max(1, len(companies)))
    #         matrix = json.dumps({"include": [{"index": i, "total": n} for i in range(n)]})
    #         with open(os.environ["GITHUB_OUTPUT"], "a") as out:
    #             out.write(f"matrix={matrix}\n")
    #         print(f"Generated {n} slice(s) for {len(companies)} company/companies")
    #         EOF

    # ── Single job: scrape all companies ───────────────────────────────────────
    scrape:
        runs-on: ubuntu-latest
        timeout-minutes: 45 # njoyn alone can take ~10 min; budget for the full list

        # strategy:
        #   matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
        #   fail-fast: false  # let other slices complete even if one slice fails

        env:
            # Secrets are injected via Doppler (see "Inject Doppler secrets" step below).
            # Only one GitHub secret is required:
            #   Settings → Secrets and variables → Actions → DOPPLER_TOKEN
            #
            # The Doppler service token must be scoped to the config that contains:
            #   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, SCRAPER_SECRET
            DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Doppler CLI
              uses: dopplerhq/cli-action@v3

            # ── Node / Astro server ────────────────────────────────────────────────
            # The Astro app is built and started locally (using the Node adapter) so that:
            #  • /api/admin/scrape has no serverless timeout and can spawn Python subprocesses
            #  • /api/admin/upload writes directly to Supabase
            #  • No logic is duplicated in Python
            #
            # The Netlify adapter is only used when building on Netlify (NETLIFY=true env var).
            # In GitHub Actions (NETLIFY unset), the Node standalone adapter is used instead,
            # producing dist/server/entry.mjs which is started here as a local server.
            # ──────────────────────────────────────────────────────────────────────

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install Node dependencies
              run: pnpm install --frozen-lockfile

            - name: Cache Astro build
              id: astro-cache
              uses: actions/cache@v4
              with:
                  path: dist/
                  key: astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'src/**', 'astro.config.*', 'tsconfig.json') }}

            - name: Build Astro
              if: steps.astro-cache.outputs.cache-hit != 'true'
              run: pnpm build

            - name: Start Astro server
              run: |
                doppler run -- node dist/server/entry.mjs > /tmp/astro-server.log 2>&1 &
                echo "SERVER_PID=$!" >> $GITHUB_ENV
              env:
                HOST: 127.0.0.1
                PORT: 4321

            - name: Wait for server to be ready
              run: |
                echo "Waiting for http://localhost:4321..."
                for i in $(seq 1 60); do
                    if curl -s -o /dev/null http://localhost:4321; then
                        echo "Server ready after ${i}s"
                        exit 0
                    fi
                    echo "  attempt $i/60..."
                    sleep 1
                done
                echo "--- Astro server log ---"
                cat /tmp/astro-server.log
                echo "Server did not become ready within 60s"
                exit 1

            # ── Python / scraper ───────────────────────────────────────────────────

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: 'pip'
                  cache-dependency-path: scraper/requirements.txt

            - name: Install Python dependencies
              run: pip install -r scraper/requirements.txt

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}

            - name: Install Playwright browser (with system deps)
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: playwright install --with-deps chromium

            - name: Install Playwright system deps (browser from cache)
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: playwright install-deps chromium

            # ── Run ───────────────────────────────────────────────────────────────

            - name: Run batch scrape
              env:
                  DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
              run: |
                  doppler run -- python scraper/batch_run.py \
                    --api-url http://localhost:4321 \
                    ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

            - name: Dump Astro server log
              if: failure()
              run: cat /tmp/astro-server.log

              # ── Logs ──────────────────────────────────────────────────────────────
            # The Astro server writes a human-readable text log to logs/YYYY-MM-DD.log
            # (same format as local dev) with per-position signal details.
            # Uploaded here as a downloadable artifact; retained 90 days.
            # The Markdown summary written to $GITHUB_STEP_SUMMARY appears directly
            # on each job's summary page — no download needed for a quick overview.

            - name: Upload scrape logs
              if: always() # upload even when the scrape step failed
              uses: actions/upload-artifact@v4
              with:
                  name: scrape-logs
                  path: logs/
                  if-no-files-found: ignore
                  retention-days: 90

            # ── Failure notification ───────────────────────────────────────────────
            # GitHub automatically emails the repository owner when any workflow fails
            # (Settings → Notifications). No extra setup needed for basic alerts.
            #
            # For a Slack or custom webhook notification, replace the step below with
            # your preferred action (e.g. slackapi/slack-github-action).
            - name: Post failure summary
              if: failure()
              run: |
                  echo "::error::Batch scrape failed. Check the logs above for details."
                  echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
