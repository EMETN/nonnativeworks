name: Quality

# Formatting, linting, and tests for pull requests and pushes to main.
on:
    pull_request:
    push:
        branches: [main]

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            # ── Node / Prettier / tests ──────────────────────────────────────
            - name: Setup pnpm
              uses: pnpm/action-setup@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version-file: '.node-version'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Secret scan
              run: pnpm lint:secrets

            - name: Prettier (format check)
              run: pnpm format:check

            - name: Tests
              run: pnpm test

            # ── Python / Ruff ────────────────────────────────────────────────
            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.12'

            - name: Install Ruff
              run: |
                  python -m pip install --upgrade pip
                  pip install --group scraper/pyproject.toml:dev

            - name: Ruff (format check)
              run: ruff format --check scraper

            - name: Ruff (lint)
              run: ruff check scraper
