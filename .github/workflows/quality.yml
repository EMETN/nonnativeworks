name: Quality

# Formatting, linting, and tests for pull requests and pushes to main.
on:
    pull_request:
    push:
        branches: [main]

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # ── Node / Prettier / tests ──────────────────────────────────────
            - name: Setup pnpm
              uses: pnpm/action-setup@v5

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.node-version'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Secret scan
              run: pnpm lint:secrets

            - name: Prettier (format check)
              run: pnpm format:check

            - name: Typecheck
              run: pnpm typecheck

            - name: Install Doppler CLI
              uses: dopplerhq/cli-action@v4

            - name: Build (timed)
              env:
                  DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
              run: |
                  start=$(date +%s)
                  doppler run -- pnpm build
                  echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> $GITHUB_ENV

            - name: Build budget guard
              run: node scripts/check-build-budget.mjs "$BUILD_SECONDS"

            - name: Tests
              env:
                  DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
              run: doppler run -- pnpm test

            # ── Python / Ruff ────────────────────────────────────────────────
            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.12'

            - name: Install Ruff
              run: |
                  python -m pip install --upgrade pip
                  pip install --group scraper/pyproject.toml:dev

            - name: Ruff (format check)
              run: ruff format --check scraper

            - name: Ruff (lint)
              run: ruff check scraper
