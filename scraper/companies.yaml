# Scheduled scrape job — company list
#
# Add a company here ONLY after testing it manually via the admin scraper tab
# and confirming that the results look correct.
#
# Dry-run to validate without uploading:
#   python scraper/batch_run.py --dry-run
#
# ─── Fields ───────────────────────────────────────────────────────────────────
#   name            Display name — for readability only, not used by the scraper
#   url             Career page URL passed to the scraper (required)
#   min_positions   Minimum expected positions across all tracked countries.
#                   The batch job fails this company if fewer are found.
#                   Set conservatively — companies do occasionally have slow
#                   hiring periods. Default: 1
#   is_english_company  Flag the company as English-only in the UI. Default: false
# ──────────────────────────────────────────────────────────────────────────────

