# Scheduled scrape job — company list
#
# Add a company here ONLY after testing it manually via the admin scraper tab
# and confirming that the results look correct.
#
# Dry-run to validate without uploading:
#   python scraper/batch_run.py --dry-run
#
# ─── Fields ───────────────────────────────────────────────────────────────────
#   name            Display name — for readability only, not used by the scraper
#   url             Career page URL passed to the scraper (required)
#   min_positions   Minimum expected positions across all tracked countries.
#                   If fewer are found, the company FAILS the run (a red run +
#                   email) — usually a sign the scraper regressed.
#                   Special case — min_positions: 0 : the company is allowed to be
#                   empty. When it returns 0 positions it's reported as a WARNING
#                   (run stays green, flagged for manual verification) instead of a
#                   failure. Use it for companies that legitimately sit empty for
#                   stretches. Any company with min_positions >= 1 that returns 0
#                   still fails, as before.
#                   Set conservatively — companies do occasionally have slow
#                   hiring periods. Default: 1
#                   Set to 0 to allow zero positions without failing — the job
#                   will still warn and leave existing database entries untouched.
#   is_english_company  Flag the company as English-only in the UI. Default: false
# ──────────────────────────────────────────────────────────────────────────────

companies:
    - name: ABB
      url: https://careers.abb/global/en/search-results
      min_positions: 10

    - name: ABN AMRO
      url: https://www.werkenbijabnamro.nl/en/vacancies
