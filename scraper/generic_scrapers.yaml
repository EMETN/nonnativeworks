# Generic static-HTML scraper configs
#
# Each entry matches a URL substring and drives generic_paginated.py.
# Use this for career sites that render jobs as plain HTML (no JavaScript
# required). Two extraction modes are supported; choose based on how the
# site structures its job data.
#
# ── Shared fields (all modes) ─────────────────────────────────────────────────
#
#   match             Substring matched against the career page URL (required)
#   name              Display name used in log messages
#   extract_mode      css_cards (default) | attribute_json | script_json
#                     | teamtailor
#   list_url          Override the URL used for listing pages (use when the
#                     input URL differs from the first page URL)
#   extra_params          Fixed query params always appended (e.g. sort order)
#   json_html_key         When set, the response is parsed as JSON and this key's
#                         string value is used as the HTML to extract cards from.
#                         Use when the endpoint wraps HTML inside a JSON envelope
#                         (e.g. { "results": "<ul>...</ul>" }).
#   request_delay         Minimum seconds between the starts of two requests, for
#                         sites that rate-limit (WPP's nginx 429s above ~1/sec).
#                         Applies to listing and detail-page fetches alike.
#                         Default: 0 (no throttling)
#   concurrency           Requests in flight at once, for listing pages and detail
#                         pages alike. Default: 1 (one at a time; forced to 1
#                         whenever request_delay is set). Raising it is the single
#                         biggest speed-up available on a slow-rendering site, but
#                         verify against a FULL run first — five in flight over
#                         ~1,000 Siemens pages earned a tenant-wide IP block.
#   max_retries           Retries for a 429 or 5xx response, with exponential
#                         backoff. Default: 0
#   description_selector  CSS selector for the job description on the detail page
#                         Used for language classification (English-titled jobs only).
#                         Default: tries .jobdescription, .job-description,
#                                  [class*="description"], article, main
#
# ── Pagination (shared, required unless the whole list fits on one page) ──────
#
#   pagination.type       offset | page | index | none
#                           offset — param = page_number * page_size  (e.g. startrow=0,25,50)
#                           page   — param = page_number + 1          (e.g. page=1,2,3)
#                           index  — param = page_number              (e.g. i=0,1,2)
#                           none   — single fetch, no pagination
#   pagination.param      Query-parameter name (e.g. "startrow", "page", "i")
#   pagination.page_size  Expected results per page; stop when fewer are returned
#   pagination.max_pages  Safety ceiling (default: 200)
#   pagination.value_template
#                         Format string wrapping the computed page value, with a
#                         {page} placeholder. Use when the site wants more than a
#                         bare number in the parameter (e.g. "page={page}").
#   pagination.param_join Separator used to append the page value to a value the
#                         country filter already set on the same parameter,
#                         instead of overwriting it. Use when a site packs its
#                         refinement and page number into one parameter — e.g.
#                         "&" yields qs_search_job=refine.country=spain&page=2.
#
# ── extract_mode: css_cards (default) ────────────────────────────────────────
#
# Jobs are repeating HTML elements. Inspect the page source and find the
# element that wraps one job row or card.
#
#   card_selector         CSS selector for the repeating element that wraps one job
#                         (required) e.g. "tr.data-row", "li.job-card"
#   title_selector        CSS selector for the job title within a card
#                         Default: first <a> or first heading (h2–h4)
#   location_selector     CSS selector for the location within a card
#                         Default: first element whose class matches a location pattern
#   country_filter_param  Query-parameter name used by the site to filter by country
#                         (e.g. "optionsFacetsDD_country"). When combined with
#                         countries, the scraper runs one paginated fetch per country
#                         and merges results before description enrichment. Use this
#                         when the site does not support multi-value country params.
#   countries             List of ISO alpha-2 country codes to fetch when
#                         country_filter_param is set (e.g. [FI, SE, NO]).
#                         Ignored if country_filter_param is absent.
#   country_values        Map of ISO alpha-2 → site-specific filter value.
#                         When set, the filter param uses the mapped value
#                         instead of the ISO code, and each job is tagged with
#                         the ISO country_code. Ignored without country_filter_param.
#   url_selector          CSS selector for the job link when it is NOT on the
#                         title element itself (href extracted from this element)
#   job_function_selector CSS selector for the job function/area on the detail page
#                         Extracted during the same fetch as description_selector.
#                         Used as the primary category classification signal (higher
#                         weight than title or description).
#                         Example: "[data-careersite-propertyid='department']"
#
# ── extract_mode: attribute_json ─────────────────────────────────────────────
#
# All jobs are encoded as a JSON array in an HTML attribute on a single
# container element (common with web components). Open the page source and
# find the element — e.g. <career-list-page open-positions='[{...}]'>.
# Pagination is usually not needed (all jobs load in one request).
#
#   container_selector    CSS selector for the element that holds the attribute
#                         (required) e.g. "career-list-page"
#   attribute_name        Name of the HTML attribute containing the JSON array
#                         (required) e.g. "open-positions"
#   fields.title          Key name for the job title in each JSON object
#                         Default: "title"
#   fields.url            Key name for the job URL
#                         Default: "url"
#   fields.location       Key name for the location (string or array — first used)
#   fields.country        Key name for the country (string or array). When an array,
#                         one job entry is created per country (fan-out).
#                         countries[i] and locations[i] are treated as parallel arrays.
#   fields.job_function   Key name for the job function/department. Set directly on
#                         the job — no detail page fetch needed.
#
# ── extract_mode: script_json ────────────────────────────────────────────────
#
# Jobs are embedded as a JSON array under a named key inside a Next.js RSC
# script tag (self.__next_f.push([id, "...escaped payload..."])). All fields
# support dot notation for nested access (e.g. "header.roleTitle").
# Location fan-out works via an array of location objects.
#
#   script_key            Key name for the jobs array in the RSC payload
#                         (required) e.g. "parsedJobs"
#   fields.title          Dot-path to job title (default: "title")
#   fields.url            Dot-path to job URL (relative URLs are resolved)
#   url_template          Builds the URL from top-level item keys instead of
#                         fields.url, e.g. "/acme/job-details/{id}/overview"
#   fields.locations      Dot-path to array of location objects
#   fields.location_subfield  Dot-path within each location object for city/location string
#   fields.country_subfield   Dot-path within each location object for country code
#                             One job is created per location object (fan-out).
#   fields.job_function   Dot-path to job function/department string
#   url_template          (script_var_json) Job URL built from payload fields with
#                         {field} placeholders, e.g.
#                         'https://example.com/job/{jobId}'. Use instead of
#                         fields.url when the listing carries no link to the posting.
#   fields.description    (script_var_json) Key holding description text already in
#                         the listing payload. Used as a fallback when the detail
#                         page yields nothing — it never replaces that fetch. A
#                         listing teaser is usually too short to classify language
#                         from, so treating one as sufficient silently marks
#                         local-language postings as English-friendly.
#   description_json_key  Key to read the description from in the detail page's
#                         embedded JSON, for sites that render the posting
#                         client-side so no CSS selector can reach it. Tried only
#                         when description_selector yields too little text.
#                         (numeric parts index into arrays, e.g. "depts.0.name")
#   fields.description    Dot-path to the description HTML; "$78"-style RSC
#                         references are resolved. Skips the detail page fetch.

# ── extract_mode: teamtailor ──────────────────────────────────────────────────
#
# TeamTailor career sites render jobs in a fixed HTML template. Jobs are in
# #jobs_list_container > li. Each card has a link with the title and a metadata
# div (class "text-md") with department · location · work-type separated by
# middots. No additional selectors needed — the mode handles parsing internally.
# Pagination uses ?page=1,2,3… and stops when fewer than page_size jobs return.
#
# Only shared fields + pagination are used; card/title/location selectors are
# ignored.

# ── extract_mode: xml_feed ───────────────────────────────────────────────────
#
# Jobs are served as an XML document (e.g. SuccessFactors job feed). Each job
# is a child element identified by item_tag (default: "job"). Field values are
# read from child element text. Descriptions come inline so no detail page
# fetches are needed. No pagination — all jobs arrive in one response.
#
#   item_tag              XML element name for each job (default: "job")
#   fields.title          Child element for title (default: "title")
#   fields.url            Child element for job URL (default: "url")
#   fields.location       Child element for city/location (default: "city")
#   fields.country        Child element for ISO country code (default: "country")
#   fields.job_function   Child element for department (default: "department")
#   fields.description    Child element for HTML description (default: "description")

scrapers:
    # ── Bolt ────────────────────────────────────────────────────────────────────
    - match: 'bolt.eu/en/careers/positions'
      name: Bolt
      extract_mode: script_json
      script_key: parsedJobs
      pagination:
          type: page
          param: page
          page_size: 20
      description_selector: 'main'
      fields:
          title: header.roleTitle
          url: body.applyLinkProps.href
          locations: header.locations
          location_subfield: city
          country_subfield: countryCode
          job_function: header.teamTitle

    # ── Allianz ────────────────────────────────────────────────────────────────────
    # Phenom People site fronted by CloudFront; jobs come from the phApp payload.
    # location uses cityStateCountry, not city: the bare city resolves to a country
    # for barely half the board (COQUELLES, LOGROÑO, TRIESTE, "Upcountry" and the
    # like are not in the city map), while "WARSZAWA, Poland" resolves every time.
    # Every job fetches its detail page. descriptionTeaser is kept only as a
    # fallback for when that fetch yields nothing — it is far too short to decide
    # the language question on its own: a ~300-char German teaser carries too few
    # umlauts for the classifier's character count and reads as English to it.
    # The posting's description lives in a script payload rather than the DOM,
    # hence description_json_key instead of a CSS selector.
    # The payload has no link to the posting itself — applyUrl and imApplyUrl both
    # point at the SuccessFactors application form — so url_template rebuilds the
    # real job page from jobId. The trailing title slug the site puts on its own
    # links is decorative: the id alone serves the right posting.
    - match: 'careers.allianz.com/global/en/search-results'
      name: Allianz
      max_retries: 3
      extract_mode: script_var_json
      var_name: phApp
      data_path: data.jobs
      pagination:
          type: offset
          param: from
          page_size: 10
      extra_params:
          s: 1
      url_template: 'https://careers.allianz.com/global/en/job/{jobId}'
      description_json_key: description
      fields:
          title: title
          location: cityStateCountry
          job_function: category
          description: descriptionTeaser

      # ── Metso ────────────────────────────────────────────────────────────────────
    - match: 'metso.com/corporate/careers/open-jobs'
      name: Metso
      extract_mode: attribute_json
      pagination:
          type: none
      container_selector: 'careers-list-page'
      attribute_name: 'open-positions'
      description_selector: '.jobdescription'
      fields:
          title: title
          url: url
          location: locations
          country: countries
          job_function: jobFamily

    # ── Neste ────────────────────────────────────────────────────────────────────
    - match: 'jobs.neste.com'
      name: Neste
      extra_params:
          sortColumn: referencedate
          sortDirection: desc
      pagination:
          type: offset
          param: startrow
          page_size: 25
      card_selector: 'tr.data-row'
      title_selector: 'a.jobTitle-link'
      location_selector: 'td.colLocation'
      description_selector: '.jobdescription'
      job_function_selector: "[data-careersite-propertyid='department']"

    # ── SAP ──────────────────────────────────────────────────────────────────────
    # SuccessFactors site that only accepts one country per request. country_filter_param
    # + countries makes the scraper iterate one paginated fetch per country and
    # merge results before description enrichment. Not jobs.sap.com: Cloudflare-challenged.
    - match: 'careers.sap.com'
      name: SAP
      country_filter_param: 'optionsFacetsDD_country'
      countries:
          - FI
          - SE
          - 'NO'
          - DK
          - IS
          - NL
          - DE
          - EE
          - LV
          - LT
          - PL
          - FR
          - BE
          - LU
          - CH
      pagination:
          type: offset
          param: startrow
          page_size: 25
      card_selector: 'tr.data-row'
      title_selector: 'a.jobTitle-link'
      location_selector: 'td.colLocation'
      description_selector: '.jobdescription'
      job_function_selector: "[data-careersite-propertyid='department']"

    # ── Vaisala ──────────────────────────────────────────────────────────────────
    - match: 'careers.vaisala.com'
      name: Vaisala
      extra_params:
          sortColumn: referencedate
          sortDirection: desc
      pagination:
          type: offset
          param: startrow
          page_size: 25
      card_selector: 'tr.data-row'
      title_selector: 'a.jobTitle-link'
      location_selector: 'td.colLocation'
      description_selector: '.jobdescription'
      job_function_selector: "[data-careersite-propertyid='department']"

    # ── Fortum ──────────────────────────────────────────────────────────────────
    - match: 'jobs.fortum.com'
      name: Fortum
      extra_params:
          sortColumn: referencedate
          sortDirection: desc
      pagination:
          type: offset
          param: startrow
          page_size: 25
      card_selector: 'tr.data-row'
      title_selector: 'a.jobTitle-link'
      location_selector: 'td.colLocation'
      description_selector: '.jobdescription'
      job_function_selector: "[data-careersite-propertyid='department']"

    # ── Hiab ──────────────────────────────────────────────────────────────────
    - match: 'careers.hiab.com/search'
      name: Hiab
      extra_params:
          sortColumn: referencedate
          sortDirection: desc
      pagination:
          type: offset
          param: startrow
          page_size: 25
      card_selector: 'tr.data-row'
      title_selector: 'td.colTitle a.jobTitle-link'
      location_selector: 'td.colLocation .jobLocation'
      description_selector: '.jobdescription'
      job_function_selector: 'td.colFacility jobFacility'

    # ── Wärtsilä ──────────────────────────────────────────────────────────────────
    - match: 'careers.wartsila.com/search'
      name: Wärtsilä
      extra_params:
          sortColumn: referencedate
          sortDirection: desc
      pagination:
          type: offset
          param: startrow
          page_size: 25
      card_selector: 'tr.data-row'
      title_selector: 'td.colTitle a.jobTitle-link'
      location_selector: 'td.colLocation .jobLocation'
      description_selector: '.jobdescription'
      job_function_selector: 'td.colFacility jobFacility'

      # ── Vestas ──────────────────────────────────────────────────────────────────
    - match: 'careers.vestas.com/search'
      name: Vestas
      extra_params:
          sortColumn: referencedate
          sortDirection: desc
      pagination:
          type: offset
          param: startrow
          page_size: 10
      card_selector: 'tr.data-row'
      title_selector: 'td.colTitle a.jobTitle-link'
      location_selector: 'td.colLocation .jobLocation'
      description_selector: '.jobdescription'
      job_function_selector: 'td.colFacility jobFacility'

    # ── Sweco Group ──────────────────────────────────────────────────────────────────
    # description_selector is required: the fallback chain otherwise grabs a
    # local-language application form field and misclassifies English postings as
    # non-English. Both classes are listed because sweco.nl splits the language-bearing
    # intro paragraph (recruitee-vacancy-desc) from the body (cb).
    - match: 'swecogroup.com/careers/vacancies'
      name: Sweco Group
      description_selector: 'section.recruitee-vacancy-desc, section.cb'
      country_filter_param: country
      # Facet IDs are read live off the page's country <select>, so an added Sweco
      # country is scraped and facet-ID drift self-heals without a code change.
      country_from_select:
          selector: 'select[name=country]'
          strip_prefix: 'Sweco '
      pagination:
          type: page
          param: vacancy-page
          page_size: 10
      extra_params:
          scroll-to: vacancies-top
      card_selector: 'tr.vacancy--list'
      title_selector: 'h3.vacancy__title'
      location_selector: 'em.vacancy__location'
      url_selector: 'a.js-vacancy-link'

    # ── Siemens Healthineers (Phenom) ────────────────────────────────────────────
    # phenom_api queries one tracked country at a time (discovered from the
    # country facet). url_template, not applyUrl: SuccessFactors (P-) reqs have
    # no applyUrl.
    - match: 'careers.siemens-healthineers.com/global/en/search-results'
      name: Siemens Healthineers
      extract_mode: phenom_api
      api_body:
          refNum: SHDSHWUS
          lang: en_global
          siteType: external
      url_template: '/global/en/job/{jobId}'
      country_filter_param: country
      pagination:
          type: offset
          param: from
          page_size: 100
      fields:
          title: title
          location: location
          locations: multi_location

    # ── Siemens ──────────────────────────────────────────────────────────────────
    # Avature portal, same markup family as Siemens Healthineers above — but a far
    # bigger board: ~1,270 postings across the 25 tracked-country facets, served 6
    # to a page (folderRecordsPerPage is capped server-side; 25/50/100 all return 6).
    # That is ~212 listing pages plus a detail fetch per English-titled job: ~45
    # minutes, which is why Siemens lives in companies-local.yaml rather than the
    # scheduled companies.yaml. Leave it serial — see the note there before setting
    # `concurrency`, which is fast but is what earned a tenant-wide IP block.
    # list_url pins the bare search URL so extra_params is the only source of truth —
    # the facet-filtered URL an operator pastes into the admin tab would otherwise be
    # appended to these params, sending 42414 twice.
    # The 42414 facet is the country refinement — one numeric option ID per country,
    # all 25 tracked ones listed here in the same order as the table in
    # scraper/country-filters.md. 42414_format and listFilterMode come from the
    # site's own filtered URL and are required — dropping them drops the filter.
    # About 28% of cards read "Multiple Locations" rather than a city, so
    # detail_location_selector resolves those from the detail page and fans them out
    # into one entry per country they cover.
    - match: 'jobs.siemens.com'
      name: Siemens
      list_url: https://jobs.siemens.com/en_US/externaljobs/SearchJobs/
      extra_params:
          '42414': '[812123,812131,812009,812145,812141,812124,812008,812020,812134,812132,811990,812024,812126,812120,812010,812011,812133,812130,812027,812023,812097,812022,812119,812013,812129]'
          '42414_format': '17570'
          listFilterMode: '1'
          folderRecordsPerPage: '6'
      pagination:
          type: offset
          param: folderOffset
          page_size: 6
          # ~212 pages today; the 200 default would silently cut the tail.
          max_pages: 300
      card_selector: 'article.article--result'
      title_selector: 'h3.article__header__text__title a.link'
      location_selector: 'span.list-item-location'
      description_selector: '#section1__content .article__content__view__field__value'
      detail_location_selector: 'ul.list--locations li'

    # ── Nordnet (TeamTailor) ────────────────────────────────────────────────────
    - match: 'career.nordnetab.com'
      name: Nordnet
      extract_mode: teamtailor
      description_selector: 'div.prose'
      pagination:
          type: page
          param: page
          page_size: 25

    # ── UpCloud (TeamTailor) ────────────────────────────────────────────────────
    - match: 'upcloud.teamtailor.com'
      name: UpCloud
      extract_mode: teamtailor
      description_selector: 'div.prose'
      pagination:
          type: page
          param: page
          page_size: 25

    # ── Futurice (TeamTailor) ────────────────────────────────────────────────────
    - match: 'careers.futurice.com/en-GB/jobs'
      name: Futurice
      extract_mode: teamtailor
      description_selector: 'div.prose'
      pagination:
          type: page
          param: page
          page_size: 25

    # ── Tekever (TeamTailor) ─────────────────────────────────────────────────────
    # page_size must be 20 (Teamtailor's page length); 25 stops the loop after page 1.
    - match: 'careers.tekever.com'
      name: Tekever
      extract_mode: teamtailor
      description_selector: 'div.prose'
      pagination:
          type: page
          param: page
          page_size: 20

    # ── Volvo Group ──────────────────────────────────────────────────────────────
    # SuccessFactors XML job feed. Contains all fields inline (title, city,
    # 2-letter country code, department, HTML description) — no detail page
    # fetches needed.
    - match: 'jobs.volvogroup.com/feed'
      name: Volvo Group
      extract_mode: xml_feed
      item_tag: job
      fields:
          title: title
          url: url
          location: city
          country: country
          job_function: department
          description: description

    # ── Scout24 ─────────────────────────────────────────────────────────────────
    # Static HTML career page, all jobs on one page. Location in subtitle is
    # pipe-separated: "Berlin | immediately | Scout24 SE" — country-lookup
    # handles the pipe split.
    - match: 'scout24.com/en/career/jobs'
      name: Scout24
      pagination:
          type: none
      card_selector: 'div.teaser--job'
      title_selector: 'a.teaser__link'
      location_selector: 'div.teaser__subtitle'
      description_selector: 'div.job__main-column'

    # ── Munich Re ────────────────────────────────────────────────────────────
    # Results come from /results endpoint as a partial HTML fragment.
    # Filtered to Germany only (ActiveFacetID 2921044) — the only tracked country.
    # All params from the working browser request are preserved; stripping any of
    # them causes the server to return a JSON stub instead of HTML.
    - match: 'careers.munichre.com/en/search-jobs'
      name: Munich Re
      list_url: https://careers.munichre.com/en/search-jobs/results
      extra_params:
          ActiveFacetID: 2921044
          RecordsPerPage: 15
          'FacetFilters[0].Display': Germany
          SearchResultsModuleName: 'Section 19 - Search Results'
          SearchFiltersModuleName: 'Section 19 - Search Filters'
      json_html_key: results
      pagination:
          type: page
          param: CurrentPage
          page_size: 15
      card_selector: 'div.search-results-list__details'
      title_selector: 'a.search-results-list__job-link'
      location_selector: 'li.job-list-01-list__job-info--location span'
      job_function_selector: 'li.job-list-01-list__job-info--category span'

    # ── Carlsberg ──────────────────────────────────────────────────────────────
    # SuccessFactors Career Site Builder (tile theme). Server-rendered HTML, no
    # browser needed. startrow doesn't return an empty page past the last one —
    # it wraps back to page 1 — so termination relies on the last real page
    # returning fewer than page_size tiles.
    # Each locale serves a distinct, non-overlapping slice of jobs across many
    # countries (not a per-country filter) — locale_param/locales fetches and
    # merges all of them, deduped by job key. Locale list is every option in the
    # site's language switcher as of 2026-08.
    - match: 'careers.carlsberg.com'
      name: Carlsberg
      list_url: https://careers.carlsberg.com/search/
      extra_params:
          createNewAlert: false
          q: ''
          locationsearch: ''
      locale_param: locale
      locales:
          - en_GB
          - da_DK
          - de_DE
          - fi_FI
          - fr_FR
          - it_IT
          - nb_NO
          - pl_PL
          - sv_SE
      pagination:
          type: offset
          param: startrow
          page_size: 10
      card_selector: 'li.job-tile'
      title_selector: 'a.jobTitle-link'
      location_selector: 'div[id$="-desktop-section-location-value"]'
      description_selector: '.jobdescription'

    # ── WPP ────────────────────────────────────────────────────────────────────
    # CareerSiteCloud. Server-rendered HTML — no browser needed. Every refinement
    # and the page number are packed into one query parameter as an inner
    # querystring (qs_search_job=refine.country=spain&page=2), which is what
    # value_template + param_join build. Without a country filter the full list
    # is ~2,400 jobs over 119 pages, so filtering per tracked country cuts the
    # run to a fraction of that and tags every job with an authoritative country.
    # The site's nginx 429s above roughly one request per second — hence
    # request_delay; max_retries covers the occasional 429 that still slips
    # through. The listing card's description is the same boilerplate blurb on
    # every job, so language classification depends on the detail page.
    # Country values are the site's own facet slugs ("+" is its space).
    # Countries with no postings today are kept in the list so new ones get
    # picked up; each costs one request.
    - match: 'wpp.careersitecloud.com'
      name: WPP
      request_delay: 1
      max_retries: 3
      country_filter_param: 'qs_search_job'
      countries:
          - FI
          - SE
          - 'NO'
          - DK
          - IS
          - NL
          - DE
          - EE
          - LV
          - LT
          - PL
          - FR
          - BE
          - LU
          - CH
          - ES
          - PT
          - AT
          - IT
          - HU
          - HR
          - RO
          - BG
          - GR
          - CZ
      country_values:
          FI: 'refine.country=finland'
          SE: 'refine.country=sweden'
          'NO': 'refine.country=norway'
          DK: 'refine.country=denmark'
          IS: 'refine.country=iceland'
          NL: 'refine.country=netherlands'
          DE: 'refine.country=germany'
          EE: 'refine.country=estonia'
          LV: 'refine.country=latvia'
          LT: 'refine.country=lithuania'
          PL: 'refine.country=poland'
          FR: 'refine.country=france'
          BE: 'refine.country=belgium'
          LU: 'refine.country=luxembourg'
          CH: 'refine.country=switzerland'
          ES: 'refine.country=spain'
          PT: 'refine.country=portugal'
          AT: 'refine.country=austria'
          IT: 'refine.country=italy'
          HU: 'refine.country=hungary'
          HR: 'refine.country=croatia'
          RO: 'refine.country=romania'
          BG: 'refine.country=bulgaria'
          GR: 'refine.country=greece'
          CZ: 'refine.country=czech+republic'
      pagination:
          type: index
          param: 'qs_search_job'
          page_size: 20
          value_template: 'page={page}'
          param_join: '&'
      card_selector: '.job-listing-full li'
      title_selector: 'h3 a'
      location_selector: '.category-location .city'
      description_selector: '.description-info'
      job_function_selector: 'tr:has(td.job-field:-soup-contains("Category")) td.job-field-value'

    # ── Heineken ───────────────────────────────────────────────────────────────
    # Drupal Views listing, server-rendered. Two quirks:
    #  • The view sits on pager element 2, so Drupal wants the multi-pager form
    #    "page=,,N" — a plain "page=N" is silently ignored and every request
    #    returns page 1. value_template builds it.
    #  • The page is wired for infinite scroll, but the same markup comes back
    #    from a plain paginated GET, so no browser is needed.
    # list_url pins the bare listing URL so the country filter below is the only
    # source of truth — pasting an already-filtered URL into the admin tab can't
    # double up the params. The 16 countries are every tracked country Heineken's
    # own filter offers; it has no FI/SE/NO/DK/IS/EE/LV/LT/LU option at all.
    - match: 'careers.theheinekencompany.com'
      name: Heineken
      list_url: https://careers.theheinekencompany.com/Job-Listing
      extra_params:
          field_location_country_code_1[]:
              - AT
              - BE
              - BG
              - CH
              - CZ
              - DE
              - ES
              - FR
              - GR
              - HR
              - HU
              - IT
              - NL
              - PL
              - PT
              - RO
      pagination:
          type: index
          param: page
          page_size: 10
          value_template: ',,{page}'
      card_selector: '.job-list-item'
      title_selector: '.job-title a'
      location_selector: '.job-location .nation'
      description_selector: '.job-fields'
      job_function_selector: '.job-meta-grid .function'
    # ── Klarna ─────────────────────────────────────────────────────────────────────
    # Detail pages render client-side, so descriptions come from the listing payload.
    - match: 'jobs.deel.com/klarna'
      name: Klarna
      extract_mode: script_json
      script_key: jobPostings
      url_template: '/klarna/job-details/{id}/overview'
      pagination:
          type: none
      fields:
          title: title
          locations: job.jobLocations
          location_subfield: location.name
          job_function: job.jobDepartments.0.department.name
          description: richtextDescription
