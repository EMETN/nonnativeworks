# Ruff configuration for the Python scraper.
# Ruff handles both linting and formatting. See https://docs.astral.sh/ruff/

# Dev-only tooling (PEP 735 dependency group). Not needed at runtime.
# Install with: pip install --group scraper/pyproject.toml:dev
[dependency-groups]
dev = ["ruff==0.16.0"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: flake8-bugbear, SIM: flake8-simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
# The formatter owns line length; E501 only fires on unsplittable strings/comments.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
